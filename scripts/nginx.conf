server {
    listen 8080;
    server_name _;
    client_max_body_size 1m;
    resolver 127.0.0.11 valid=5s ipv6=off;
    location / {
        set $backend http://api:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
}
