limit_req_zone $binary_remote_addr zone=voice_hooks:1m rate=100r/s;
server {
    listen 8080;
    server_name _;
    client_max_body_size 512k;
    client_body_timeout 30s;
    proxy_request_buffering off;
    resolver 127.0.0.11 valid=5s ipv6=off;
    # Bound every signed provider callback, including incoming-call routes.
    # Capacity allows a 20-agent lifecycle burst while retaining an edge ceiling.
    location ^~ /api/telephony/twilio/ {
        limit_except POST { deny all; }
        client_max_body_size 16k;
        client_body_timeout 5s;
        proxy_request_buffering on;
        limit_req zone=voice_hooks burst=200 nodelay;
        limit_req_status 429;
        set $backend http://api:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
    # Authentication payloads contain only short credentials. Reject oversized
    # JSON before application parsing; CSV uploads retain their separate budget.
    location ^~ /api/auth/ {
        client_max_body_size 16k;
        client_body_timeout 5s;
        proxy_request_buffering on;
        set $backend http://api:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
    location ~ "^/api/imports/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/source$" {
        limit_except PUT { deny all; }
        client_max_body_size 10m;
        set $backend http://api:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 120s;
    }
    location / {
        set $backend http://api:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 120s;
    }
}
