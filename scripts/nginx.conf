limit_req_zone $binary_remote_addr zone=voice_hooks:1m rate=10r/s;
server {
    listen 8080;
    server_name _;
    client_max_body_size 10m;
    client_body_timeout 30s;
    proxy_request_buffering off;
    resolver 127.0.0.11 valid=5s ipv6=off;
    location ~ "^/api/telephony/twilio/(probe|voice|parent-status|(status|finish|recording)/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$" {
        limit_except POST { deny all; }
        client_max_body_size 16k;
        client_body_timeout 5s;
        proxy_request_buffering on;
        limit_req zone=voice_hooks burst=20 nodelay;
        limit_req_status 429;
        set $backend http://api:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
    location / {
        set $backend http://api:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 120s;
    }
}
