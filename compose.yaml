name: unlimited-talk-staging

x-app: &app
  image: unlimited-talk-staging-api:foundation
  build: .
  environment:
    APP_ENV: staging
    COMMUNICATIONS_MODE: disabled
    DB_HOST: db
    DB_NAME: unlimited_talk_staging
  networks: [staging]
  read_only: true
  tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 100
  logging:
    driver: json-file
    options: {max-size: 5m, max-file: "2"}

services:
  db:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: unlimited_talk_staging
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [postgres_password, migrator_password, runtime_password]
    volumes:
      - staging_pgdata:/var/lib/postgresql
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    networks: [staging]
    mem_limit: 768m
    cpus: 0.5
    pids_limit: 150
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d unlimited_talk_staging"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
  migrate:
    <<: *app
    environment:
      APP_ENV: staging
      COMMUNICATIONS_MODE: disabled
      DB_HOST: db
      DB_NAME: unlimited_talk_staging
      DB_USER: ut_staging_migrator
      DB_PASSWORD_FILE: /run/secrets/migrator_password
    secrets: [migrator_password]
    command: [alembic, upgrade, head]
    depends_on:
      db: {condition: service_healthy}
    mem_limit: 256m
    cpus: 0.25
    restart: "no"
  api:
    <<: *app
    environment:
      APP_ENV: staging
      COMMUNICATIONS_MODE: disabled
      DB_HOST: db
      DB_NAME: unlimited_talk_staging
      DB_USER: ut_staging_runtime
      DB_PASSWORD_FILE: /run/secrets/runtime_password
    secrets: [runtime_password]
    depends_on:
      migrate: {condition: service_completed_successfully}
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
  gateway:
    image: nginxinc/nginx-unprivileged:stable-alpine@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
    ports: ["127.0.0.1:8110:8080"]
    volumes:
      - ./scripts/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [staging, ingress]
    depends_on:
      api: {condition: service_healthy}
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    cpus: 0.1
    pids_limit: 30
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}

networks:
  staging:
    internal: true
  ingress:
volumes:
  staging_pgdata:
secrets:
  postgres_password: {file: ./secrets/postgres_password}
  migrator_password: {file: ./secrets/migrator_password}
  runtime_password: {file: ./secrets/runtime_password}
