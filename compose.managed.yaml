name: unlimited-talk-staging-managed
x-app:
  image: ${STAGING_IMAGE:?Set a tested image by immutable digest}
  pull_policy: never
  user: 10001:10001
  networks: &id001
  - staging
  read_only: true
  tmpfs: &id002
  - /tmp:rw,noexec,nosuid,size=32m
  cap_drop: &id003
  - ALL
  security_opt: &id004
  - no-new-privileges:true
  pids_limit: 100
  logging: &id005
    driver: local
    options:
      max-size: 5m
      max-file: '2'
x-environment:
  APP_ENV: staging
  COMMUNICATIONS_MODE: disabled
  DB_DEPLOYMENT: managed
  DB_PRIVATE_CIDR: ${STAGING_DB_CIDR:?Set the private staging database CIDR}
  DB_HOST: ${STAGING_DB_HOST:?Set the private staging database hostname}
  DB_NAME: unlimited_talk_staging
  DB_SSLMODE: verify-full
  DB_SSLROOTCERT: /run/secrets/postgres_ca
services:
  migrate:
    image: ${STAGING_IMAGE:?Set a tested image by immutable digest}
    pull_policy: never
    user: 10001:10001
    networks: *id001
    read_only: true
    tmpfs: *id002
    cap_drop: *id003
    security_opt: *id004
    pids_limit: 100
    logging: *id005
    environment:
      APP_ENV: staging
      COMMUNICATIONS_MODE: disabled
      DB_DEPLOYMENT: managed
      DB_PRIVATE_CIDR: ${STAGING_DB_CIDR:?Set the private staging database CIDR}
      DB_HOST: ${STAGING_DB_HOST:?Set the private staging database hostname}
      DB_NAME: unlimited_talk_staging
      DB_SSLMODE: verify-full
      DB_SSLROOTCERT: /run/secrets/postgres_ca
      DB_USER: ut_staging_migrator
      DB_PASSWORD_FILE: /run/secrets/migrator_password
    secrets:
    - postgres_ca
    - migrator_password
    command:
    - alembic
    - upgrade
    - head
    mem_limit: 256m
    cpus: 0.25
    restart: 'no'
  api:
    image: ${STAGING_IMAGE:?Set a tested image by immutable digest}
    pull_policy: never
    user: 10001:10001
    networks: *id001
    read_only: true
    tmpfs: *id002
    cap_drop: *id003
    security_opt: *id004
    pids_limit: 100
    logging: *id005
    environment:
      APP_ENV: staging
      COMMUNICATIONS_MODE: disabled
      DB_DEPLOYMENT: managed
      DB_PRIVATE_CIDR: ${STAGING_DB_CIDR:?Set the private staging database CIDR}
      DB_HOST: ${STAGING_DB_HOST:?Set the private staging database hostname}
      DB_NAME: unlimited_talk_staging
      DB_SSLMODE: verify-full
      DB_SSLROOTCERT: /run/secrets/postgres_ca
      APP_ORIGIN: ${STAGING_APP_ORIGIN:?Set the HTTPS staging origin}
      IDENTITY_KEY_FILE: /run/secrets/identity_key
      DB_USER: ut_staging_runtime
      DB_PASSWORD_FILE: /run/secrets/runtime_password
      SPACES_CONFIG_FILE: /run/secrets/spaces_config
    secrets:
    - postgres_ca
    - runtime_password
    - identity_key
    - spaces_config
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 512m
    cpus: 1
    restart: on-failure:5
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready',
        timeout=5)
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 10s
  gateway:
    image: nginxinc/nginx-unprivileged:stable-alpine@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
    ports:
    - 127.0.0.1:8110:8080
    volumes:
    - ./scripts/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
    - staging
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 30
    restart: on-failure:5
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: '2'
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:8080/health/ready
      interval: 10s
      timeout: 6s
      retries: 6
  worker:
    image: ${STAGING_IMAGE:?Set a tested image by immutable digest}
    pull_policy: never
    user: 10001:10001
    networks:
    - staging
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 100
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: '2'
    environment:
      APP_ENV: staging
      COMMUNICATIONS_MODE: disabled
      DB_DEPLOYMENT: managed
      DB_PRIVATE_CIDR: ${STAGING_DB_CIDR:?Set the private staging database CIDR}
      DB_HOST: ${STAGING_DB_HOST:?Set the private staging database hostname}
      DB_NAME: unlimited_talk_staging
      DB_SSLMODE: verify-full
      DB_SSLROOTCERT: /run/secrets/postgres_ca
      DB_USER: ut_staging_runtime
      DB_PASSWORD_FILE: /run/secrets/runtime_password
      BROKER_PASSWORD_FILE: /run/secrets/broker_password
    secrets:
    - postgres_ca
    - runtime_password
    - broker_password
    depends_on:
      broker:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1
    restart: on-failure:5
    command:
    - celery
    - -A
    - app.contacts.tasks
    - worker
    - --loglevel=WARNING
    - --concurrency=1
    - --without-gossip
    - --without-mingle
    - --without-heartbeat
  dispatcher:
    image: ${STAGING_IMAGE:?Set a tested image by immutable digest}
    pull_policy: never
    user: 10001:10001
    networks:
    - staging
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 100
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: '2'
    environment:
      APP_ENV: staging
      COMMUNICATIONS_MODE: disabled
      DB_DEPLOYMENT: managed
      DB_PRIVATE_CIDR: ${STAGING_DB_CIDR:?Set the private staging database CIDR}
      DB_HOST: ${STAGING_DB_HOST:?Set the private staging database hostname}
      DB_NAME: unlimited_talk_staging
      DB_SSLMODE: verify-full
      DB_SSLROOTCERT: /run/secrets/postgres_ca
      DB_USER: ut_staging_runtime
      DB_PASSWORD_FILE: /run/secrets/runtime_password
      BROKER_PASSWORD_FILE: /run/secrets/broker_password
    secrets:
    - postgres_ca
    - runtime_password
    - broker_password
    depends_on:
      broker:
        condition: service_healthy
    mem_limit: 192m
    cpus: 0.25
    restart: on-failure:5
    command:
    - python
    - -m
    - app.contacts.dispatch
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import pathlib,time; assert time.time()-pathlib.Path('/tmp/dispatcher-heartbeat').stat().st_mtime<45
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
  broker:
    image: redis:8.2-alpine@sha256:35bf3d49a07b693d8defb4e4fc9ef8c663f71c2993f181eba99c7b72966c1f9b
    user: 999:999
    command:
    - sh
    - /opt/broker-start.sh
    volumes:
    - broker_data:/data
    - ./scripts/broker-start.sh:/opt/broker-start.sh:ro
    secrets:
    - broker_password
    networks:
    - staging
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 30
    mem_limit: 192m
    cpus: 0.25
    restart: on-failure:5
    healthcheck:
      test:
      - CMD-SHELL
      - REDISCLI_AUTH=$$(cat /run/secrets/broker_password) redis-cli ping | grep -q
        PONG
      interval: 10s
      timeout: 5s
      retries: 6
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: '2'
networks:
  staging:
    driver: bridge
    ipam:
      config:
      - subnet: 172.30.8.0/24
secrets:
  postgres_ca:
    file: /etc/unlimited-talk-staging/postgres-ca.crt
  runtime_password:
    file: /etc/unlimited-talk-staging/container-secrets/runtime_password
  migrator_password:
    file: /etc/unlimited-talk-staging/container-secrets/migrator_password
  identity_key:
    file: /etc/unlimited-talk-staging/container-secrets/identity_key
  spaces_config:
    file: /etc/unlimited-talk-staging/container-secrets/spaces_config
  broker_password:
    file: /etc/unlimited-talk-staging/container-secrets/broker_password
volumes:
  broker_data: {}
