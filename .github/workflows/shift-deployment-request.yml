name: Request approved shift reliability deployment
on:
  push:
    branches: [ops/shift-deployment-20261127]
    paths: [.github/workflows/shift-deployment-request.yml]
permissions:
  contents: read
  actions: write
jobs:
  request-reviewed-current-main:
    if: github.repository == 'climatsynergie/unlimited-talk' && github.ref == 'refs/heads/ops/shift-deployment-20261127'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Dispatch the normal protected workflow for the exact tested release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_REVISION: 86230a2fa1a3a6b2af5b8d1e60144fbb9191c5c2
        run: |
          python3 - <<'PYCODE'
          import json,os,subprocess
          repository='climatsynergie/unlimited-talk'
          revision=os.environ['REQUESTED_REVISION']
          assert os.environ['GITHUB_REPOSITORY']==repository
          assert os.environ['GITHUB_REF']=='refs/heads/ops/shift-deployment-20261127'
          def api(path):
              return json.loads(subprocess.check_output(['gh','api','repos/'+repository+'/'+path],text=True))
          assert api('commits/main')['sha']==revision,'Main moved; this one-time request is stale'
          runs=api('actions/workflows/ci.yml/runs?head_sha='+revision+'&branch=main&status=success')['workflow_runs']
          assert any(r['head_sha']==revision and r['head_branch']=='main' and r['event']=='push'
              and r['head_repository']['full_name']==repository and r['conclusion']=='success' for r in runs)
          subprocess.run(['gh','workflow','run','deploy-staging.yml','--repo',repository,'--ref','main','-f','revision='+revision],check=True)
          print('Requested the existing protected deployment. The active-call guard remains enforced.')
          PYCODE
