name: Foundation CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Generate disposable CI database credentials
        run: python3 scripts/bootstrap-secrets.py
      - name: Validate SSH secret formatting and key identity
        run: python3 -m unittest discover -s tests/host -p 'test_*.py' -v
      - name: Build the preceding compatibility release for rollback verification
        run: python3 scripts/build-identity-rollback-image.py
      - name: Validate configuration and build image
        run: |
          docker compose config --quiet
          docker compose build --build-arg GIT_REVISION="$GITHUB_SHA" api
      - name: Test database configuration guards
        run: >-
          docker run --rm --network none --read-only
          --tmpfs /tmp:rw,noexec,nosuid,size=32m --cap-drop ALL
          --security-opt no-new-privileges --memory 256m
          -v "$PWD/tests:/tests:ro"
          -v "$PWD/scripts:/scripts:ro"
          unlimited-talk-staging-api:foundation
          python -m unittest discover -s /tests -p 'test_*.py' -v
      - name: Set up the browser verification runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.4'
      - name: Install web verification dependencies
        timeout-minutes: 3
        run: |
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
          npm run --prefix frontend format:check
      - name: Install the tested Chromium headless shell
        timeout-minutes: 5
        working-directory: frontend
        run: npx playwright install --only-shell chromium
      - name: Verify Chromium runtime and install missing libraries if required
        timeout-minutes: 6
        working-directory: frontend
        run: |
          if ! node scripts/check-browser.mjs; then
            npx playwright install-deps chromium
            node scripts/check-browser.mjs
          fi
      - name: Start disposable local environment
        run: docker compose up -d --wait --wait-timeout 180
      - name: Verify HTTP, PostgreSQL and isolation
        run: python3 tests/verify_foundation.py
      - name: Verify identities, permissions and session revocation
        run: python3 tests/verify_identity.py
      - name: Verify browser flows through local HTTPS
        run: python3 tests/verify_browser.py
      - name: Verify rollback preserves the identity schema and data
        run: python3 tests/verify_identity_rollback.py
      - name: Verify database outage and recovery
        run: python3 tests/verify_recovery.py
      - name: Export the tested image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p artifacts
          docker save unlimited-talk-staging-api:foundation | gzip > artifacts/tested-image.tar.gz
          docker image inspect unlimited-talk-staging-api:foundation --format '{{.Id}}' > artifacts/image-id.txt
          sha256sum artifacts/tested-image.tar.gz > artifacts/image.sha256
      - name: Keep the exact tested image for publication
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-image-${{ github.sha }}
          path: artifacts/
          retention-days: 3
          compression-level: 0
      - name: Show service diagnostics
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail 50 api migrate gateway
      - name: Stop disposable environment
        if: always()
        run: docker compose down

  publish:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Retrieve the image that passed tests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tested-image-${{ github.sha }}
          path: artifacts/
      - name: Verify and publish without rebuilding
        id: publish
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          sha256sum -c artifacts/image.sha256
          gunzip -c artifacts/tested-image.tar.gz | docker load
          test "$(docker image inspect unlimited-talk-staging-api:foundation --format '{{.Id}}')" = "$(cat artifacts/image-id.txt)"
          test "$(docker image inspect unlimited-talk-staging-api:foundation --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
          image="ghcr.io/climatsynergie/unlimited-talk-api:git-$GITHUB_SHA"
          docker tag unlimited-talk-staging-api:foundation "$image"
          docker push "$image"
          reference=$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')
          printf 'digest=%s\n' "${reference##*@}" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$reference" >> "$GITHUB_STEP_SUMMARY"
      - name: Attest the tested image provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-name: ghcr.io/climatsynergie/unlimited-talk-api
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
