name: Read sanitized synthetic import CI failure
on:
  push:
    branches: [ops/shift-ci-diagnostics-20261127]
    paths: [.github/workflows/shift-ci-diagnostics.yml]
permissions:
  contents: read
  actions: read
jobs:
  diagnostics:
    if: github.repository == 'climatsynergie/unlimited-talk' && github.ref == 'refs/heads/ops/shift-ci-diagnostics-20261127'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Extract only sanitized failure messages from the fixed synthetic test job
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64,json,os,re,subprocess,tempfile
          from pathlib import Path
          stage='identity'
          try:
              repo='climatsynergie/unlimited-talk'
              branch='ops/shift-ci-diagnostics-20261127'
              assert os.environ['GITHUB_REPOSITORY']==repo and os.environ['GITHUB_REF']=='refs/heads/'+branch
              def api(path):return json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/'+path],text=True))
              stage='run_metadata'
              run=api('actions/runs/45921665592')
              assert run['head_sha']=='b526a44750c5b2f01795d9d7fdc538102df148ea' and run['path']=='.github/workflows/ci.yml'
              stage='job_metadata'
              job=api('actions/jobs/140253575334')
              assert job['run_id']==45921665592 and job['conclusion']=='failure'
              stage='download_logs'
              result=subprocess.run(['gh','api','repos/'+repo+'/actions/jobs/140253575334/logs'],capture_output=True,text=True)
              if result.returncode:
                  print('::notice title=Log endpoint outcome::'+str(result.returncode)+' '+(' '.join(re.findall(r'HTTP [0-9]{3}|Resource not accessible|Must have admin rights|Not Found|Bad credentials',result.stderr))))
                  raise RuntimeError('Authenticated log retrieval failed')
              raw=result.stdout
              stage='parse_logs'
              marker='Run python3 tests/verify_import_dispatch_race.py'
              fragment=raw.split(marker,1)[1].split('##[group]',1)[0] if marker in raw else raw
              selected=[]
              for line in fragment.splitlines():
                  line=re.sub(r'^\d{4}-\d\d-\d\dT\S+\s+','',line)
                  line=re.sub(r'\x1b\[[0-9;]*m','',line)
                  if not re.search(r'(?:FAIL|ERROR): test_|test_.*\.\.\. (?:FAIL|ERROR)|(?:AssertionError|TypeError|RuntimeError|KeyError|ValueError|TimeoutError|ImportError|ModuleNotFoundError|AttributeError|IndexError):|psycopg\.errors\.|sqlalchemy\.exc\.|^Ran \d+ tests|^FAILED',line):continue
                  if re.search(r'password|secret|token|authorization|bearer|credential',line,re.I):
                      line=re.sub(r'(:).*',r'\1 [sensitive content redacted]',line)
                  line=re.sub(r'(?:AC|SK|CA|RE)[0-9a-fA-F]{32}','[synthetic identifier]',line)
                  line=re.sub(r'\+\d{9,15}','[synthetic phone]',line)
                  selected.append(line[:800])
              if not selected:selected=['No exception pattern matched the selected synthetic step.']
              record=dict(source_run=45921665592,source_job=140253575334,scope='Sanitized synthetic import test failures only; raw logs never published',lines=selected)
              output=json.dumps(record,indent=2)+'\n'
              notice=output.replace('%','%25').replace(chr(13),'%0D').replace(chr(10),'%0A')
              print('::notice title=Sanitized synthetic import failure::'+notice)
          except Exception as error:
              print('::error title=Sanitized diagnostic stage::'+stage+' '+type(error).__name__)
              raise
          PY
