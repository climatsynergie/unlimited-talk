name: Reproduce synthetic import CI from fresh PostgreSQL
on:
  push:
    branches: [ops/shift-ci-diagnostics-20261127]
    paths: [.github/workflows/shift-ci-diagnostics.yml, qa-reports/tools/reproduce_fresh_import_ci.py]
permissions:
  contents: read
jobs:
  reproduce:
    if: github.repository == 'climatsynergie/unlimited-talk' && github.ref == 'refs/heads/ops/shift-ci-diagnostics-20261127'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the diagnostic source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Generate disposable-only credentials
        run: python3 scripts/bootstrap-secrets.py
      - name: Build the exact backend source on its unchanged tested dependency base
        run: |
          docker build --build-arg GIT_REVISION="$GITHUB_SHA" -t unlimited-talk-staging-api:foundation -f - . <<'DOCKER'
          FROM ghcr.io/climatsynergie/unlimited-talk-api@sha256:65bc7e7750006552d129a2466f13cfb7e589bd3f43f202b48f8414b03a6b825c
          ARG GIT_REVISION
          ENV APP_REVISION=$GIT_REVISION
          LABEL org.opencontainers.image.revision="$GIT_REVISION"
          COPY backend/ /app/
          DOCKER
      - name: Reproduce the unchanged migration, identity and import CI prefix
        run: python3 qa-reports/tools/reproduce_fresh_import_ci.py
      - name: Stop isolated diagnostic services
        if: always()
        run: docker compose down
